<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="300" height="300" viewBox="0 0 300 300" style="background-color:#ffffff;">
  <rect width="300" height="300" fill="#ffffff"/>
  
  <!-- QR-like pattern (visual demo) -->
  <g stroke="#000000" stroke-width="6" fill="none">
    <!-- Top-left finder pattern -->
    <rect x="8" y="8" width="84.00000000000001" height="84.00000000000001"/>
    <rect x="13" y="8" width="60" height="60"/>
    <rect x="8" y="13" width="60" height="60"/>
    
    <!-- Top-right finder pattern -->
    <rect x="216" y="8" width="84.00000000000001" height="84.00000000000001"/>
    <rect x="231" y="8" width="60" height="60"/>
    
    <!-- Bottom-left finder pattern -->
    <rect x="8" y="216" width="84.00000000000001" height="84.00000000000001"/>
    <rect x="13" y="231" width="60" height="60"/>
  </g>
  
  <!-- Center logo area -->
  <circle cx="150" cy="150" r="45" fill="none" stroke="#000000" stroke-width="3"/>
</svg>